version: 2

models:
  - name: int_ga4__sessions
    description: >
      One row per GA4 session (user_pseudo_id + ga_session_id), built from every event of the
      session, not from session_start. No event in the sample lacks a ga_session_id (i1); the
      filter in the model is a guard. Table, partitioned by session_date.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "session_end_at >= session_start_at and event_count >= 1"
    columns:
      - name: session_key
        description: Surrogate of user_pseudo_id + ga_session_id, built in stg_ga4__events.
        data_tests: [unique, not_null]
      - name: user_pseudo_id
        data_tests: [not_null]
      - name: session_date
        description: Reporting-timezone date of the first event; a session crossing midnight keeps its start date.
        data_tests: [not_null]
      - name: landing_page
        description: page_location of the first event that has one.
      - name: is_engaged
        description: TRUE if any event of the session carries session_engaged = '1'.
      - name: has_session_start_event
        description: FALSE for the 5,272 sessions GA4 recorded without a session_start event.
      - name: has_purchase
        description: A purchase event fired, identified or not; transaction_count counts identified ones only.
      - name: first_touch_source
        description: The USER's first touch, repeated on each session. Not session attribution (ga4_notes).

  - name: int_backend__order_status_history
    description: >
      One row per status event with the interval [valid_from, valid_to) during which it was the
      order's status. Status at time T and current status are both read from here; orders
      carry no status column (docs/decisions.md 2026-10-27). Ordered by event time, so
      late-arriving events sit in their true position. 160 orders have placed and paid at the
      same instant; status_rank breaks the tie.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, status_sequence]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "valid_to is null or valid_to >= valid_from"
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_backend__orders')
          config:
            where: "is_current"        # every order has exactly one current status
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_backend__orders')
                field: order_id
          - unique:
              config:
                where: "is_current"
      - name: status_sequence
        description: 1 for the first event of an order (placed), counting up in event-time order.
      - name: is_legal_transition
        description: FALSE when previous_status -> status is not allowed (domain_spec s.4). Tested in week 10.
      - name: valid_to
        description: Time of the order's next status event; NULL on the current status.
      - name: is_current
        description: TRUE on the latest status event of each order.

  - name: int_backend__customer_identity_map
    description: >
      One row per customer id raw ever issued (duplicates included), mapped to the customer
      that survives the dedup in stg_backend__customers. Resolves a duplicate customer id
      (source_customer_id) or a GA4 cookie (user_pseudo_id, where is_canonical) to one customer.
      A cookie is a browser, not a person: user_id is never populated in the GA4 sample.
    columns:
      - name: source_customer_id
        description: The id as it appears on orders and surveys.
        data_tests: [unique, not_null]
      - name: customer_id
        description: The canonical customer (earliest row per cookie).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_backend__customers')
                field: customer_id
      - name: user_pseudo_id
        description: GA4 cookie id; NULL for customers behind backend-only orders.
        data_tests:
          - unique:
              config:
                where: "is_canonical"

  - name: int_reconciliation__ga4_vs_backend
    description: >
      One row per purchase known to GA4, to the backend, or to both. Identified purchases
      join on transaction_id = order_id; GA4 purchase events without a transaction id get
      a row each and can never match. Backend orders are the system of record. Answers:
      how many orders are matched, GA4-only and backend-only, and what is the revenue gap
      on matched orders (domain_spec section 9).
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_backend__orders')
          config:
            where: "is_in_backend"       # no order lost or multiplied by the joins
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_ga4__purchases')
          config:
            where: "transaction_id is not null"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "is_backend_only"
          config:
            where: "reconciliation_category = 'backend_only'"   # only 'B-' orders are unseen by GA4
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not is_backend_only"
          config:
            where: "reconciliation_category = 'matched'"
    columns:
      - name: reconciliation_key
        description: Order id (either side), or 'ga4-event-' + event_key for an unidentified purchase.
        data_tests: [unique, not_null]
      - name: reconciliation_category
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['matched', 'ga4_only', 'backend_only']
      - name: reconciliation_detail
        description: >
          Splits ga4_only into no_backend_order (GA4 has an id, the backend has no order),
          unidentified (no transaction id) and placeholder (no id, no revenue; an empty purchase event).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['matched', 'backend_only', 'ga4_only_no_backend_order',
                         'ga4_only_unidentified', 'ga4_only_placeholder']
      - name: customer_id
        description: Canonical customer via int_backend__customer_identity_map. NULL on ga4_only rows.
        data_tests:
          - not_null:
              config:
                where: "is_in_backend"
      - name: gross_revenue_delta
        description: GA4 header purchase_revenue minus backend gross_revenue; matched orders only.
      - name: net_revenue_delta
        description: GA4 header purchase_revenue minus backend net_revenue (after the unseen discount).
      - name: revenue_delta_reason
        description: >
          Primary reason on a matched order, first match wins: currency_mismatch,
          ga4_header_differs, backend_discount, exact. NULL on unmatched rows.
        data_tests:
          - accepted_values:
              arguments:
                values: ['exact', 'backend_discount', 'ga4_header_differs', 'currency_mismatch']
      - name: has_ga4_header_vs_lines_gap
        description: GA4's header revenue differs from the sum of its own net lines (833 of 4,451 in week 6).
      - name: is_same_cookie
        description: GA4 purchase cookie = stitched customer's cookie; matched orders only.
        
         
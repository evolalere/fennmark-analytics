version: 2

sources:
  - name: backend
    description: >
      Fennmark order system (system of record for orders, returns, refunds and NPS).
      Generated by generator/generate.py from the public GA4 sample
      (bigquery-public-data.ga4_obfuscated_sample_ecommerce) with seed 20201101;
      every table is rebuilt from scratch on each run (WRITE_TRUNCATE).
      GA4 is the web-behaviour source; the two meet on orders.order_id = GA4 ecommerce.transaction_id.
      Backend events run to 2021-03-15 so that order status is correct as of any date in the
      2020-11-01..2021-01-31 reporting window. Deliberate data problems are listed in
      docs/domain_spec.md section 7 and measured in generator/README.md (problem ledger).
      NOTE: the raw layer is a frozen 2021 snapshot, so freshness reports stale by design
      against the realistic thresholds below (see docs/dbt_notes.md).
    database: fennmark-analytics
    schema: fm_raw
    loader: generator/generate.py (pandas -> BigQuery load_table_from_dataframe, explicit schema)
    config:
      loaded_at_field: loaded_at
      freshness:                                                 # defaults; tables override below
        warn_after: {count: 1, period: day}
        error_after: {count: 3, period: day}

    tables:

      # ------------------------------------------------------------------ orders
      - name: orders
        description: >
          One row per order. order_id = GA4 ecommerce.transaction_id for web orders (~77%);
          'B-' ids are backend-only orders GA4 never saw (phone, app; includes the 825 forced
          A/B treatment conversions). No status column by design (docs/decisions.md 2026-10-27):
          status is derived from order_status_events.
          SCHEMA CHANGE (deliberate): the shipping-country column was renamed on 2021-01-01.
          Rows placed before that date fill ship_country; rows from that date fill
          shipping_country; each is NULL exactly where the other is filled (4,263 / 1,195 rows).
          The generator loads two files into this one table; staging coalesces the two columns.
        config:
          freshness:
            warn_after: {count: 1, period: hour}
            error_after: {count: 1, period: day}
        columns:
          - name: order_id
            data_type: STRING
            description: GA4 transaction_id, or 'B-' + 6 digits for backend-only orders. Primary key.
          - name: customer_id
            data_type: STRING
            description: "-> customers.customer_id. May point at a duplicate customer row (7 orders; see customers)."
          - name: placed_at
            data_type: TIMESTAMP
            description: UTC. Equals the GA4 purchase event timestamp for seeded orders.
          - name: channel
            data_type: STRING
            description: web | app | phone. web for every GA4-seeded order; app and phone only on 'B-' orders.
          - name: payment_method
            data_type: STRING
            description: card | paypal | invoice | giftcard
          - name: currency
            data_type: STRING
            description: USD, except 20 rows that deliberately say EUR with the USD amounts unchanged (ledger; staging flags them).
          - name: gross_revenue
            data_type: FLOAT64
            description: Before discount. = GA4 purchase_revenue for seeded orders. FLOAT64 in raw, cast to NUMERIC in staging.
          - name: discount_amount
            data_type: FLOAT64
            description: Applied after the GA4 event on ~15% of seeded orders; 0 on backend-only orders. One of the known GA4-vs-backend revenue gaps.
          - name: ship_country
            data_type: STRING
            description: DEPRECATED column name. Shipping country (ISO-2) for rows placed before 2021-01-01; NULL afterwards. Coalesced with shipping_country in staging.
          - name: shipping_country
            data_type: STRING
            description: Shipping country (ISO-2) for rows placed from 2021-01-01; NULL before. Coalesced with ship_country in staging.
          - name: loaded_at
            data_type: TIMESTAMP
            description: When the row reached raw (placed_at + 1-20 min). Freshness field.

      # ------------------------------------------------------------------ order_items
      - name: order_items
        description: >
          One row per product line on an order. Seeded lines come from GA4 items[] on the
          purchase event; backend-only lines are generated at list price. line_revenue is
          GA4 item_revenue (net of line discount) and is NOT always unit_price * quantity;
          18.5% of seeded orders have SUM(line_revenue) != orders.gross_revenue in GA4 itself.
        config:
          freshness:
            warn_after: {count: 1, period: hour}
            error_after: {count: 1, period: day}
        columns:
          - name: order_item_id
            data_type: STRING
            description: order_id + '-' + line number (1-based). Primary key.
          - name: order_id
            data_type: STRING
            description: "-> orders.order_id"
          - name: product_id
            data_type: STRING
            description: "-> products.product_id (GA4 item_id). Never NULL: the 448 placeholder purchases are dropped before seeding."
          - name: quantity
            data_type: INT64
            description: = GA4 items.quantity for seeded lines; 1-2 for backend-only lines.
          - name: unit_price
            data_type: FLOAT64
            description: = GA4 items.price on that purchase, not products.list_price (the same SKU sells at different prices in one week).
          - name: line_revenue
            data_type: FLOAT64
            description: = GA4 items.item_revenue for seeded lines (net); unit_price * quantity for backend-only lines.
          - name: loaded_at
            data_type: TIMESTAMP
            description: = its order's loaded_at (a line arrives with its order). Added 2026-11-02.

      # ------------------------------------------------------------------ order_status_events
      - name: order_status_events
        description: >
          One row per status change, generated from the lifecycle in docs/domain_spec.md
          section 4. The only place order status exists.
          DELIBERATE PROBLEMS: event_ts_raw is a STRING in two formats
          ('2020-11-14 09:12:33' UTC for ~90%, '2020-11-14T10:12:33+01:00' Europe/Berlin
          with offset for ~10%); staging parses both to one UTC TIMESTAMP.
          ~10% of rows arrive late (loaded_at 1-3 days after the event); Week 9's incremental
          lookback window handles them. 5 refunds reference orders whose latest event here is
          'shipped' (bad refunds, Week 10 test).
        config:
          freshness:
            warn_after: {count: 1, period: hour}
            error_after: {count: 1, period: day}
        columns:
          - name: event_id
            data_type: STRING
            description: "'E-' + 7 digits, numbered in (order_id, timestamp) order. Primary key."
          - name: order_id
            data_type: STRING
            description: "-> orders.order_id"
          - name: status
            data_type: STRING
            description: placed | paid | shipped | delivered | cancelled | returned | refunded
          - name: event_ts_raw
            data_type: STRING
            description: Event time as a string in two formats (see table description). Parsed to event_at in staging; the raw string is not carried forward.
          - name: reason
            data_type: STRING
            description: >
              NULL except on cancelled and returned events.
              Cancelled: payment_failed | customer_request | out_of_stock | fraud_check.
              Returned: wrong_size | damaged | not_as_described | changed_mind (same value as returns.reason for that order).
          - name: loaded_at
            data_type: TIMESTAMP
            description: Event time + 1-15 min for ~90% of rows; + 1-3 days for ~10% (late-arriving). Freshness field.

      # ------------------------------------------------------------------ customers
      - name: customers
        description: >
          One row per customer account. ~90% seeded from distinct purchasing GA4 user_pseudo_id
          values; the rest are behind backend-only orders (user_pseudo_id NULL) or are treatment
          users given a forced A/B conversion.
          DELIBERATE PROBLEMS: 73 duplicate rows (same user_pseudo_id and email, new
          customer_id, later created_at; 7 orders point at the duplicate) - staging keeps the
          earliest row per cookie. email_consent is a STRING with ~15% NULL - staging casts to
          BOOL and keeps NULL.
        config:
          freshness:
            warn_after: {count: 1, period: hour}
            error_after: {count: 1, period: day}
        columns:
          - name: customer_id
            data_type: STRING
            description: "'C-' + 6 digits. Primary key in raw (unique even for duplicate persons)."
          - name: user_pseudo_id
            data_type: STRING
            description: GA4 cookie id the row was seeded from; NULL for backend-only customers. Unique only after staging dedup.
          - name: full_name
            data_type: STRING
            description: Faker.
          - name: email
            data_type: STRING
            description: Faker; identical on the duplicate rows.
          - name: country
            data_type: STRING
            description: ISO-2. = GA4 geo.country for seeded customers.
          - name: email_consent
            data_type: STRING
            description: "'true' | 'false' | NULL (~15% NULL, deliberate). STRING in raw, BOOL in staging."
          - name: acquisition_date
            data_type: DATE
            description: Date of first order.
          - name: created_at
            data_type: TIMESTAMP
            description: Account creation, 1-180 min before the first order. Later on the duplicate row; staging orders by it to keep the earliest.
          - name: loaded_at
            data_type: TIMESTAMP
            description: created_at + 1-30 min. Freshness field.

      # ------------------------------------------------------------------ products
      - name: products
        description: >
          Catalogue, one row per SKU, keyed on GA4 item_id (already one id per size or option).
          All 1,231 SKUs seen on view_item or purchase, including 422 never sold.
          DELIBERATE PROBLEM: category is item_category as GA4 reports it - a navigation
          breadcrumb, not a taxonomy ('Home/Apparel/Men's / Unisex/', 'New', 'Shop by Brand',
          blanks, 6 NULL). Staging maps it to a canonical category via the
          product_category_overrides seed and keeps the raw value beside it.
          Reference data loaded once per generator run; no freshness check.
        config:
          freshness: null                               # a week without a new SKU can be expected for a merch brand
        columns:
          - name: product_id
            data_type: STRING
            description: = GA4 items.item_id. Primary key.
          - name: product_name
            data_type: STRING
            description: = item_name, most frequent non-empty spelling per id.
          - name: variant
            data_type: STRING
            description: "= item_variant. 'Single Option Only' is the sentinel for non-sized merch (NULL in staging); 157 NULL."
          - name: category
            data_type: STRING
            description: = item_category as GA4 reports it, navigation labels and blanks included. Overridden in staging.
          - name: list_price
            data_type: FLOAT64
            description: Reference selling price = mode of items.price over the window. The price actually charged is order_items.unit_price.
          - name: cost_price
            data_type: FLOAT64
            description: 40-70% of list_price, band per category in generator/config.yml. Margin = unit_price - cost_price.
          - name: supplier
            data_type: STRING
            description: Faker company, one per category; 6 NULL where category is NULL.
          - name: launch_date
            data_type: DATE
            description: 30-365 days before the product's first GA4 appearance.
          - name: loaded_at
            data_type: TIMESTAMP
            description: Fixed catalogue-load timestamp per run (window end + 1 day 02:00 UTC).

      # ------------------------------------------------------------------ returns
      - name: returns
        description: >
          One row per return request, generated for ~8% of delivered orders within 30 days of
          delivery. A return is a request that can be refused (accepted = false adds no status
          event and no refund). Separate from status events because it carries a reason and an
          acceptance decision, which fct_returns needs.
        config:
          freshness:
            warn_after: {count: 1, period: day}
            error_after: {count: 2, period: day}
        columns:
          - name: return_id
            data_type: STRING
            description: "'R-' + 6 digits. Primary key."
          - name: order_id
            data_type: STRING
            description: "-> orders.order_id (delivered orders only)"
          - name: order_item_id
            data_type: STRING
            description: "-> order_items.order_item_id for a line return (~60%); NULL = whole-order return (~40%)."
          - name: requested_at
            data_type: TIMESTAMP
            description: Within 30 days of delivery.
          - name: reason
            data_type: STRING
            description: wrong_size | damaged | not_as_described | changed_mind, weighted by product category.
          - name: accepted
            data_type: BOOL
            description: ~85% true. Accepted returns produce a 'returned' status event and one refund; refused returns produce nothing.
          - name: loaded_at
            data_type: TIMESTAMP
            description: requested_at + 1-30 min. Freshness field.

      # ------------------------------------------------------------------ refunds
      - name: refunds
        description: >
          One row per refund payment: cancellations after payment (return_id NULL, whole order
          net value) and accepted returns (line value, or order net value for whole-order
          returns). Refund amount never exceeds the order value by construction.
          DELIBERATE PROBLEM: 5 refunds reference an order whose latest status is 'shipped',
          with no return and no status event (bad refunds; Week 10 singular test surfaces them).
        config:
          freshness:
            warn_after: {count: 1, period: day}
            error_after: {count: 2, period: day}
        columns:
          - name: refund_id
            data_type: STRING
            description: "'RF-' + 6 digits. Primary key."
          - name: order_id
            data_type: STRING
            description: "-> orders.order_id"
          - name: return_id
            data_type: STRING
            description: "-> returns.return_id; NULL = refund for a paid-then-cancelled order (or a bad refund)."
          - name: amount
            data_type: FLOAT64
            description: "<= order net value. Whole order for cancellations, line value for item returns. FLOAT64 in raw, NUMERIC in staging."
          - name: currency
            data_type: STRING
            description: = orders.currency (so the 20 EUR orders carry EUR here too).
          - name: refunded_at
            data_type: TIMESTAMP
            description: 1-5 days after the return acceptance or cancellation.
          - name: loaded_at
            data_type: TIMESTAMP
            description: Freshness field.

      # ------------------------------------------------------------------ nps_surveys
      - name: nps_surveys
        description: >
          One row per survey sent, one per delivered order, 2-3 days after delivery.
          ~40% responded. The score is generated with shipping time and returns as drivers
          (deliveries more than 5 days after shipping draw from a detractor-heavy band), so
          fct_nps's question "does NPS move with shipping time" has a real answer; the
          December peak-season dip is expected.
        config:
          freshness:
            warn_after: {count: 1, period: day}
            error_after: {count: 2, period: day}
        columns:
          - name: survey_id
            data_type: STRING
            description: "'S-' + 6 digits. Primary key."
          - name: order_id
            data_type: STRING
            description: "-> orders.order_id (delivered only)"
          - name: customer_id
            data_type: STRING
            description: "-> customers.customer_id"
          - name: sent_at
            data_type: TIMESTAMP
            description: delivered_at + 2-3 days.
          - name: responded_at
            data_type: TIMESTAMP
            description: NULL for ~60% (sent, no answer).
          - name: score
            data_type: INT64
            description: 0-10; NULL whenever responded_at is NULL.
          - name: verbatim
            data_type: STRING
            description: Short Faker sentence for ~30% of responses; NULL otherwise.
          - name: loaded_at
            data_type: TIMESTAMP
            description: sent_at + minutes. Freshness field.

      # ------------------------------------------------------------------ marketing_spend
      - name: marketing_spend
        description: >
          One row per day x source x medium x campaign, every day 2020-11-01..2021-01-31,
          shaped by GA4 session counts per traffic_source. Spend is 0 for organic, referral,
          (none), email and (not set) mediums and > 0 for paid ones (~10% of rows).
          No natural key by design: staging builds a surrogate from the four grain columns.
          The README's "day x source x medium" grain is not unique; campaign is part of the key.
        config:
          freshness:
            warn_after: {count: 1, period: day}
            error_after: {count: 2, period: day}
        columns:
          - name: spend_date
            data_type: DATE
            description: Part of the grain.
          - name: source
            data_type: STRING
            description: = GA4 traffic_source.source (google, facebook, (direct), (data deleted), ...). Part of the grain.
          - name: medium
            data_type: STRING
            description: = GA4 traffic_source.medium (cpc, organic, referral, (none), ...). Part of the grain.
          - name: campaign
            data_type: STRING
            description: "= GA4 traffic_source.name; '(not set)' allowed. Part of the grain."
          - name: spend_usd
            data_type: FLOAT64
            description: USD; sessions x spend-per-session from config.yml with noise; 0 for unpaid mediums. FLOAT64 in raw, NUMERIC in staging.
          - name: loaded_at
            data_type: TIMESTAMP
            description: spend_date + 1 day 06:00 UTC (a nightly feed). Freshness field.

      # ------------------------------------------------------------------ experiment_assignments
      - name: experiment_assignments
        description: >
          One row per user x experiment for the one experiment in scope (promo_badge_v1).
          Population: every GA4 user with at least one view_promotion event (102,443).
          Variant is assigned 50/50 by hashing user_pseudo_id with the generator seed.
          The +1.5 pp treatment effect is INJECTED: 825 treatment users were given a
          backend-only order within 7 days of first exposure, so the lift appears only in
          non-web channels and must be measured from orders, not GA4 purchases (Week 13).
          Reference data loaded once per generator run; no freshness check.
        config:
          freshness: null                                         # experiment_assignments isn’t a feed: a user is assigned once, at first exposure, and the table changes only when an experiment starts or stops.
        columns:
          - name: experiment_id
            data_type: STRING
            description: "'promo_badge_v1'. Part of the grain."
          - name: user_pseudo_id
            data_type: STRING
            description: GA4 cookie id. Part of the grain; joins to customers.user_pseudo_id for users who bought.
          - name: variant
            data_type: STRING
            description: control | treatment (50/50 by seeded hash).
          - name: assigned_at
            data_type: TIMESTAMP
            description: = the user's first view_promotion event.
          - name: loaded_at
            data_type: TIMESTAMP
            description: assigned_at + 5 min.
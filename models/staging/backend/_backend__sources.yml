version: 2

sources:
  - name: backend
    description: >
          Fennmark order system (system of record). Generated by generator/generate.py
          from the GA4 public sample with seed 20201101; every table is rebuilt from
          scratch on each run. Events run to 2021-03-15 so that order status is correct
          as of any date in the 2020-11-01..2021-01-31 reporting window.
    database: fennmark-analytics
    schema: fm_raw
    loader: generator/generate.py (pandas -> load_table_from_dataframe, WRITE_TRUNCATE)
    loaded_at_field: loaded_at
    freshness:                        # defaults; tables override below
      warn_after: {count: 1, period: day}
      error_after: {count: 3, period: day}
    tables:
      - name: customers
        description: >
          Fennmark order system (system of record). Generated by generator/generate.py
          from the GA4 public sample with seed 20201101; every table is rebuilt from
          scratch on each run. Events run to 2021-03-15 so that order status is correct
          as of any date in the 2020-11-01..2021-01-31 reporting window.
        columns:
          - name: customer_id
            data_type: string
            description: ""
          - name: user_pseudo_id
            data_type: string
            description: ""
          - name: full_name
            data_type: string
            description: ""
          - name: email
            data_type: string
            description: ""
          - name: country
            data_type: string
            description: ""
          - name: email_consent
            data_type: string
            description: ""
          - name: acquisition_date
            data_type: date
            description: ""
          - name: created_at
            data_type: timestamp
            description: ""
          - name: loaded_at
            data_type: timestamp
            description: ""

      - name: experiment_assignments
        description: ""
        columns:
          - name: experiment_id
            data_type: string
            description: ""
          - name: user_pseudo_id
            data_type: string
            description: ""
          - name: variant
            data_type: string
            description: ""
          - name: assigned_at
            data_type: timestamp
            description: ""
          - name: loaded_at
            data_type: timestamp
            description: ""

      - name: marketing_spend
        description: ""
        columns:
          - name: spend_date
            data_type: date
            description: ""
          - name: source
            data_type: string
            description: ""
          - name: medium
            data_type: string
            description: ""
          - name: campaign
            data_type: string
            description: ""
          - name: spend_usd
            data_type: float64
            description: ""
          - name: loaded_at
            data_type: timestamp
            description: ""

      - name: nps_surveys
        description: ""
        columns:
          - name: survey_id
            data_type: string
            description: ""
          - name: order_id
            data_type: string
            description: ""
          - name: customer_id
            data_type: string
            description: ""
          - name: sent_at
            data_type: timestamp
            description: ""
          - name: responded_at
            data_type: timestamp
            description: ""
          - name: score
            data_type: int64
            description: ""
          - name: verbatim
            data_type: string
            description: ""
          - name: loaded_at
            data_type: timestamp
            description: ""

      - name: order_items
        description: ""
        columns:
          - name: order_item_id
            data_type: string
            description: ""
          - name: order_id
            data_type: string
            description: ""
          - name: product_id
            data_type: string
            description: ""
          - name: quantity
            data_type: int64
            description: ""
          - name: unit_price
            data_type: float64
            description: ""
          - name: line_revenue
            data_type: float64
            description: ""
          - name: loaded_at
            data_type: timestamp
            description: ""

      - name: order_status_events
        description: ""
        columns:

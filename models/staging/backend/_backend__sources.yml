            description: ""

      - name: orders
        description: >
          One row per order. order_id = GA4 ecommerce.transaction_id for web orders;
          'B-' ids are backend-only (phone, app). No status column by design
          (decisions.md 2026-10-27): status is derived from order_status_events.
          SCHEMA CHANGE: the shipping country column was renamed on 2021-01-01.
          Rows placed before that date fill ship_country, rows from that date fill
          shipping_country; each is NULL exactly where the other is filled.
          Staging coalesces them. Loaded as two files into one table.
        columns:
          - name: order_id
            data_type: string
            description: ""
          - name: placed_at
            data_type: timestamp
            description: ""
          - name: user_pseudo_id
            data_type: string
            description: ""
          - name: customer_id
            data_type: string
            description: ""
          - name: channel
            data_type: string
            description: ""
          - name: payment_method
            data_type: string
            description: ""
          - name: currency
            data_type: string
            description: ""
          - name: gross_revenue
            data_type: float64
            description: ""
          - name: discount_amount
            data_type: float64
            description: ""
          - name: shipping_country
            data_type: string
            description: ""
          - name: loaded_at
            data_type: timestamp
            description: ""
          - name: ship_country
            data_type: string
            description: ""


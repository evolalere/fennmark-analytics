version: 2

models:
  - name: fct_orders
    description: >
      What were net revenue and order count per week by channel, and what share of orders did
      GA4 miss? One row per backend order (system of record). Customer is the canonical one;
      status and milestone timestamps are pivoted from int_backend__order_status_history;
      reconciliation_category comes from int_reconciliation__ga4_vs_backend. Revenue is in the
      order's own currency: filter on has_currency_mismatch before summing. All orders are kept;
      is_in_reporting_period marks the 2020-11-01 to 2021-01-31 window (docs/decisions.md).
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_backend__orders')
      - dbt_utils.expression_is_true:
          arguments:
            expression: "round(net_revenue, 2) = round(gross_revenue - discount_amount, 2)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "is_backend_only = (reconciliation_category = 'backend_only')"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "delivered_at >= shipped_at and shipped_at >= paid_at"
          config:
            where: "is_delivered"
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        description: Canonical customer (duplicate ids resolved through the identity map).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: UTC date of placed_at.
        data_tests: [not_null]
      - name: order_week
        description: Monday of the order's week. The first is 2020-11-02 (no orders on Sunday 1 Nov).
      - name: channel
        data_tests:
          - accepted_values:
              arguments:
                values: ['web', 'app', 'phone']
      - name: net_revenue
        description: gross_revenue minus discount_amount, in the order's currency. Not reduced by refunds.
      - name: refunded_amount
        description: >
          Sum of refunds on the order; 0 if none. 5 orders carry a refund while still
          'shipped' (deliberate, week 10).
      - name: current_status
        description: Status of the latest status event. Orders carry no status column of their own.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['placed', 'paid', 'shipped', 'delivered', 'cancelled', 'returned', 'refunded']
      - name: days_to_deliver
        description: Whole days from placed_at to delivered_at; NULL if not delivered.
      - name: days_in_transit
        description: Whole days from shipped_at to delivered_at (the carrier leg); NULL if not delivered.
      - name: reconciliation_category
        description: matched (GA4 saw the purchase) or backend_only (it did not).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['matched', 'backend_only']
      - name: is_cancelled
        description: The order has a cancelled event, paid or not. Revenue questions exclude these.
      - name: is_in_reporting_period
        description: order_date within reporting_start_date and reporting_end_date (dbt_project.yml vars).
        data_tests: [not_null]
      - name: customer_order_number
        description: 1 for the customer's first order placed, counting up; cancelled orders included.
        data_tests: [not_null]

  - name: fct_order_items
    description: >
      Which products and categories carry the margin, and which sell volume at low margin?
      One row per product line. line_revenue is what the line sold for (net of line discount);
      margin_amount = line_revenue - cost_price x quantity. Order-level discounts are not
      allocated to lines, so line revenue does not sum to order net revenue: revenue questions
      go to fct_orders, product and margin questions come here.
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_backend__order_items')
      - dbt_utils.expression_is_true:
          arguments:
            expression: "cost_amount >= 0 and margin_amount = line_revenue - cost_amount"
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: customer_id
        description: Canonical customer, from fct_orders.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: margin_amount
        description: >
          Can be negative on a heavily discounted line. A rate is
          sum(margin_amount) / sum(line_revenue), never an average of rates.

  - name: dim_customers
    description: >
      What share of customers in the period are repeat buyers, and how many consented to email?
      One row per customer after the staging dedup. order_count, first/last order date and
      net_revenue_usd cover orders placed in the reporting period that were not cancelled.
      A NULL consent flag is treated as not consented here and nowhere earlier. No name or email.
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_backend__customers')
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(order_count = 0) = (first_order_date is null)"
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: user_pseudo_id
        description: GA4 cookie the customer was seeded from; NULL behind backend-only orders.
        data_tests: [unique]
      - name: email_consent_status
        description: consented, declined, or unknown (NULL in raw).
        data_tests:
          - accepted_values:
              arguments:
                values: ['consented', 'declined', 'unknown']
      - name: is_email_contactable
        description: TRUE only for an explicit yes. unknown counts as no.
        data_tests: [not_null]
      - name: is_repeat_buyer
        description: Two or more non-cancelled orders in the reporting period.

  - name: dim_products
    description: >
      How many products were launched in the window, and how long until first sale?
      One row per SKU (GA4 item_id). list_price is a reference price; the price charged is on
      fct_order_items. first_sold_date is NULL for SKUs that were viewed but never bought.
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_backend__products')
      - dbt_utils.expression_is_true:
          arguments:
            expression: "is_sold = (first_sold_date is not null)"
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: category
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Apparel', 'Drinkware', 'Bags', 'Accessories', 'Stationery', 'Lifestyle',
                         'Gift Cards', 'Other']
      - name: days_to_first_sale
        description: first_sold_date minus launch_date, in days; NULL if never sold.



seed: 20201101 # GA4 window's first day because it's easy to remember. Any integer will work.
bigquery:
  project: fennmark-analytics
  dataset: raw
  ga4: bigquery-public-data.ga4_obfuscated_sample_ecommerce
window: {start: "2020-11-01", end: "2021-01-31"}
shares:
  ga4_purchase_dropped: 0.05 # payment declined: GA4-only in the reconciliation
  backend_only_orders: 0.10 # of order count, B- ids, phone/app
  backend_only_new_customer: 0.30 # of backend-only orders go to customers GA4 never saw
  discounted_orders: 0.15 # discount applied after the GA4 event
  eur_orders: 20 # absolute count
  duplicate_customers: 0.02
  consent_null: 0.15
  unpaid: 0.05 # placed -> cancelled after 48 h
  cancelled_after_paid: 0.03
  returned: 0.08 # of delivered
  return_accepted: 0.85
  bad_refunds: 0.01 # refund on an order still 'shipped'
  late_status_events: 0.10 # loaded_at 1-3 days late
  offset_timestamp_format: 0.10 # event_ts_raw written as ISO with +01:00
  nps_response: 0.40
  nps_verbatim: 0.30
lags_days:
  paid_to_shipped: [1, 3]
  peak_extra_shipping: [1, 2] # added 2020-12-07 .. 2020-12-23
  shipped_to_delivered: [2, 7]
  refund_after_trigger: [1, 5]
  return_window: 30
cost_price_share: {Apparel: [0.40, 0.55], Drinkware: [0.45, 0.65], Stationery: [0.50, 0.70], default: [0.45, 0.70]}
spend_per_session_usd: {google/cpc: 0.90, facebook/cpc: 0.60, default_paid: 0.75}
experiment:
  id: promo_badge_v1
  effect_pp: 0.015
  window_days: 7


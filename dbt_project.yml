name: 'fennmark'
version: '1.0.0'

profile: 'fennmark'

require-dbt-version: [">=1.12.0", "<2.0.0"]

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  fennmark:
    staging:
      +materialized: view
      +schema: staging

seeds:
  fennmark:
    +schema: seeds
    product_category_overrides:
      +column_types: {product_id: string, raw_category: string, category: string}
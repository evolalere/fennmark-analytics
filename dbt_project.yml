name: 'fennmark'
version: '1.0.0'

profile: 'fennmark'

require-dbt-version: [">=1.12.0", "<2.0.0"]

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # GA4 public sample coverage. Mirrors generator/config.yml window:; keep in sync by hand.
  ga4_start_date: '2020-11-01'
  ga4_end_date: '2021-01-31'

  reporting_start_date: '2020-11-01'    # business reporting period, by order date (domain_spec section 6)
  reporting_end_date: '2021-01-31'

  ga4_lookback_days: 3          # an incremental run rebuilds the newest loaded day and the 3 before it
  ga4_session_buffer_days: 5    # longest span of one session, in days past its first date (incremental_checks r8)
    
models:
  fennmark:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  fennmark:
    +schema: seeds
    product_category_overrides:
      +column_types: {product_id: string, raw_category: string, category: string}